global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rag_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag_api:5000"]

  - job_name: "backend_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend_api:5001"]