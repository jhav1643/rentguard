# infra/helm/backend_api/values-prod.yaml
replicaCount: 3

image:
  repository: "" # injected by CI: --set image.repository=<ECR>/rentguard-backend-api
  tag: "" # injected by CI: --set image.tag=<git sha>
  pullPolicy: IfNotPresent

envSecretName: rentguard-env

env:
  LOG_LEVEL: info
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: prod

service:
  type: ClusterIP
  port: 5001
  targetPort: 5001

probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

serviceAccount:
  create: true
  name: backend-api
  annotations: {}

podDisruptionBudget:
  minAvailable: 2

persistence:
  enabled: false
  claimName: rentguard-shared-data
  mounts: []
