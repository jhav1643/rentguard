# ci-cd/helm/values-common.yaml
# Baseline applied to every environment before env-specific overrides.

global:
  awsRegion: us-east-1
  imagePullPolicy: IfNotPresent
  imageRegistry: "" # set at deploy time (ECR host from OIDC login)
  imageTag: "" # set at deploy time (github.sha)

# --- Service-level defaults (overridden per env) ---

rag-api:
  name: rag-api
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
  env:
    LOG_LEVEL: info
    PYTHONUNBUFFERED: "1"

backend-api:
  name: backend-api
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
  env:
    LOG_LEVEL: info

classifier-service:
  name: classifier-service
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  env:
    LOG_LEVEL: info
    MODEL_ALIAS: production # MLflow alias, flipped by promotion gate

ingestion:
  name: ingestion
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  env:
    LOG_LEVEL: info

shared-storage:
  storageClass: efs-sc # EFS for shared model artifacts / data
  size: 10Gi
  accessModes:
    - ReadWriteMany
