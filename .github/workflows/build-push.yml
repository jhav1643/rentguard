name: Build and Push Images

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_PREFIX: rentguard
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: ingestion, dockerfile: services/ingestion/Dockerfile }
          - {
              name: classifier,
              dockerfile: services/classifier_service/Dockerfile,
            }
          - { name: rag-api, dockerfile: services/rag_api/Dockerfile }
          - { name: backend-api, dockerfile: services/backend_api/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }} # <- critical fix

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${ECR_REPO_PREFIX}-${{ matrix.service.name }}"
          docker buildx build \
            --file ${{ matrix.service.dockerfile }} \
            --tag "$IMAGE:${IMAGE_TAG}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

      - name: Summary
        run: |
          echo "Pushed ${{ matrix.service.name }}:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
