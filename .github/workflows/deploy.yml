name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        service: [backend_api, rag_api, ingestion, classifier_service]

    steps:
      - name: Checkout trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER }} \
            --region ${{ vars.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Ensure namespace
        run: |
          kubectl create namespace rentguard --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync Prometheus alert rules
        run: |
          kubectl create configmap rentguard-prometheus-alerts \
            --from-file=alerts.yml=infra/observability/alerts.yml \
            --namespace rentguard \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm deploy ${{ matrix.service }}
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          RELEASE="rentguard-$(echo '${{ matrix.service }}' | tr '_' '-')"
          helm upgrade --install "$RELEASE" \
            infra/helm/${{ matrix.service }} \
            -f infra/helm/${{ matrix.service }}/values-prod.yaml \
            --set image.repository=${{ vars.ECR_REGISTRY }}/rentguard-${{ matrix.service }} \
            --set image.tag=$SHA \
            --namespace rentguard \
            --atomic \
            --timeout 10m

      - name: Reload Prometheus
        run: |
          kubectl -n monitoring exec deploy/prometheus -- \
            wget -qO- --post-data='' http://localhost:9090/-/reload || true

      - name: Deployment status
        if: always()
        run: |
          kubectl -n rentguard get deploy,po,svc,cronjob,ingress
