# ci-cd/helm/values-staging.yaml
# Staging: prod-like topology, smaller resources, real ingress, HPA off.

global:
  environment: staging
  imageRegistry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  namespace: rentguard-staging

rag-api:
  replicaCount: 2
  image:
    repository: rentguard-rag-api
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  env:
    ENVIRONMENT: staging
    RAG_TOP_K: "5"
  ingress:
    enabled: true
    host: rag.staging.rentguard.example.com
    tls: true
    tlsSecretName: rentguard-staging-tls
  autoscaling:
    enabled: false

backend-api:
  replicaCount: 2
  image:
    repository: rentguard-backend-api
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  env:
    ENVIRONMENT: staging
  ingress:
    enabled: true
    host: api.staging.rentguard.example.com
    tls: true
    tlsSecretName: rentguard-staging-tls
  autoscaling:
    enabled: false

classifier-service:
  replicaCount: 2
  image:
    repository: rentguard-classifier
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  env:
    ENVIRONMENT: staging
  autoscaling:
    enabled: false

ingestion:
  replicaCount: 1
  image:
    repository: rentguard-ingestion
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  env:
    ENVIRONMENT: staging

shared-storage:
  size: 20Gi
